name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore EcommerceBackend.Tests/EcommerceBackend.Tests.csproj

      - name: Build
        run: dotnet build EcommerceBackend.Tests/EcommerceBackend.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test EcommerceBackend.Tests/EcommerceBackend.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Build container
        run: docker build --tag ecommerce-backend:${{ github.sha }} .
